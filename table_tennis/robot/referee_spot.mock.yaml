# PRIMER kako se pune polja. Brojevi i imena su izmišljeni.
# Ne kopirati ovo na robota i ne stavljati u config.local.yaml.
# Pravi zapis ide u referee_spot.example.yaml, pa u config.local.yaml.
# U dugme ulazi samo referee_waypoint.name. map_id, point_id i metri ne idu u poziv.

model: agibot_a2_ultra
firmware: "primer-1.2.3"

map:
  map_id: 7
  map_name: kancelarija-primer
  current_working: da
  office_only: da

start_outside_office_on_map: ne

referee_waypoint:
  name: primer-pored-stola
  point_id: 42
  x: 1.20
  y: -0.80
  faces_table: "da, gleda dužu stranu stola"
  stop_distance_m: 1.5

localization:
  is_running: da
  fresh_pose: da

camera:
  better_eye: CHEST_LEFT_FISHEYE
  ball_visible_from_spot: da

gestures_resolved:
  wave: "Wave hand_right hand"
  point_left: "Direction_point to the left"
  point_right: "Direction_point to the right"
  nod_thanks: "Nod head"

screen_slot_holder: "naš scoreboard, slot emoticon_ct_message"
aima_audio_holder: "AIMA agent, predaje se tek kad meč krene"
mission_owner: operator
route_confirmed_by: operator
arrival_status: SUCCESS
