# Laptop-safe defaults. Ball color is unset until a real ball is chosen.
# hsv_lower / hsv_upper use OpenCV HSV: H 0-179, S 0-255, V 0-255.

camera_id: CHEST_LEFT_FISHEYE
origin: a2_fisheye

ball:
  hsv_lower: null
  hsv_upper: null
  min_diameter_px: 4
  max_diameter_px: 48

# null means the whole frame. Otherwise [x, y, width, height] in pixels.
roi: null

tracker:
  # Consecutive missing samples before the track is dropped.
  missing_frames: 8
