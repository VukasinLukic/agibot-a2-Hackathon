# Laptop-safe defaults. Ball color is unset until a real ball is chosen.
# hsv_lower / hsv_upper use OpenCV HSV: H 0-179, S 0-255, V 0-255.

camera_id: CHEST_LEFT_FISHEYE
origin: a2_fisheye

ball:
  hsv_lower: null
  hsv_upper: null
  min_diameter_px: 4
  max_diameter_px: 48

# null means the whole frame. Otherwise [x, y, width, height] in pixels.
roi: null

tracker:
  # Consecutive missing samples before the track is dropped.
  missing_frames: 8

# BlurBall checkpoint stays outside git. null keeps the OpenCV tracker.
# Weights: https://cloud.cs.uni-tuebingen.de/index.php/s/6Z8TpM3sXRKHzGC
model_path: null

# Candidates -> BallNet -> MHT. The .npz stays outside git; null keeps the
# HSV/BlurBall path. Exclusive with model_path.
ballnet_path: null
ballnet:
  # Frames wider than this are downscaled first. Tuned at 960.
  work_width_px: 960
  # Align the two previous frames to the current one. Off on the robot: with ARM
  # it stands still, and alignment only added candidates (noise) and CPU.
  compensate_motion: false
  # Also a ball darker than the background (in front of a bright window).
  detect_darker: false
